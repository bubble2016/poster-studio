map $arg_v $poster_asset_cache_control {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name zhizhuli.com www.zhizhuli.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/java_node_ssl;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zhizhuli.com www.zhizhuli.com;

    ssl_certificate /etc/letsencrypt/live/zhizhuli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhizhuli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /static/ {
        root /www/wwwroot/poster-generator;
        try_files $uri =404;
        etag on;
        add_header Cache-Control $poster_asset_cache_control always;
    }

    location = /favicon.ico {
        alias /www/wwwroot/poster-generator/logo.ico;
        etag on;
        add_header Cache-Control $poster_asset_cache_control always;
    }

    location ~ ^/font/(?<poster_font>(?:SourceHanSansSC-Regular\.otf|SourceHanSansSC-Bold\.otf|Bahnschrift\.ttf|NotoSansSC-VF\.ttf|MicrosoftYaHei\.ttc|LXGWWenKai-Regular\.ttf|LXGWWenKai-Medium\.ttf))$ {
        alias /www/wwwroot/poster-generator/fonts/$poster_font;
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/zhizhuli.com.access.log main;
    error_log /var/log/nginx/zhizhuli.com.error.log warn;
}
